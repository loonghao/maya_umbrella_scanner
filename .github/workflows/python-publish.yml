name: Upload Python Package

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 3
      matrix:
        os: [ 'windows-2022' ]
        python-version: ["3.10"]
      fail-fast: false
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install poetry==2.2.1 nox==2026.2.9
        poetry --version
        poetry build
    - name: Verify tag version
      id: release_version
      shell: pwsh
      run: |
        $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
        $projectVersion = poetry version --short
        if ($tagVersion -ne $projectVersion) {
          throw "Tag version $tagVersion does not match project version $projectVersion"
        }
        "version=$tagVersion" >> $env:GITHUB_OUTPUT
    - name: build exe
      id: build_exe
      run: |
        nox -s build-exe -- --release --version ${{ steps.release_version.outputs.version }}
    - name: Generate artifact checksum
      shell: pwsh
      run: |
        $archive = Get-Item ".zip/maya_umbrella_scanner-${{ steps.release_version.outputs.version }}.zip"
        $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  $($archive.Name)" | Set-Content -LiteralPath ".zip/SHA256SUMS" -Encoding ascii
    - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        artifacts: ".zip/maya_umbrella_scanner-*.zip,.zip/SHA256SUMS"
        token: ${{ secrets.GITHUB_TOKEN }}
        generateReleaseNotes: true
